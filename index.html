<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Day 7 Capstone - Devstore Catalog</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
            background-color: #f4f6f9;
        }

        header{
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        h1{
            color: #333;
            margin: 0;
        }

        .wishlist-badge{
            background-color: #ffc107;
            color: #333;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .controls{
            display: flex;
            gap: 10px;
            margin-bottom: 25px;

        }

        input, select{
            padding: 12px;
            font-size: 1rem;
            border: 1px solid #ced4da;
            border-radius: 6px;
        }

        #search-input{
            flex: 1;
        }

        category-select{
            flex: 2;
        }

        .product-grid{
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .product-card{
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card h3{
            font-size: 1.1rem;
            margin: 0 0 10px 0;
            color: #007bff;
        }

        .price{
            font-size: 1.25rem;
            font-weight: bold;
            color: #28a745;
            margin-bottom: 15px;
        }

        .wishlist-btn{
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .wishlist-btn.saved{
            background-color: #dc3545;
        }

        .wishlist-btn:hover{
            opacity: 0.9;
        }

        .loading{
            text-align: center;
            grid-column: 1/-1;
            font-size: 1.2rem;
            color: #666;
            margin-top: 40px;
        }

        
    </style>
</head>
<body>
    <header>
        <h1>🛍️ DevStore Catalog</h1>
        <div id="wishlist-counter" class="wishlist-badge">❤️ Wishlist: 0 items</div>
    </header>

    <div class="controls">
        <input type="text" id="search-input" placeholder="🔍 Search products by title...">
        <select id="category-select">
            <option value="all">All Categories</option>
        </select>        
    </div>

    <div id="product-list" class="product-grid">
        <div class="loading">Loading store catalog...</div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
